<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<style>@font-face{font-family:Poppins;font-weight:800;src:url(assets/poppins-800.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
