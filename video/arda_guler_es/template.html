<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PoppinsHF"; font-weight: 500; src: url("assets/fonts/Poppins-500.woff2") format("woff2"); }
      @font-face { font-family: "PoppinsHF"; font-weight: 800; src: url("assets/fonts/Poppins-800.woff2") format("woff2"); }
      @font-face { font-family: "MontserratHF"; font-weight: 800; src: url("assets/fonts/Montserrat-800.woff2") format("woff2"); }
      :root { --red: #ff1f1f; --ink: #ffffff; --ground: #000000; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
      #cam img.src { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #spot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: rgba(0, 0, 0, 0.58);
        -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; z-index: 5; }
      #ring { position: absolute; left: 0; top: 0; border: 5px solid #fff; border-radius: 50%; opacity: 0; z-index: 6;
        box-shadow: 0 0 14px 2px rgba(255, 255, 255, 0.55), inset 0 0 10px rgba(255, 255, 255, 0.35); }
      #tag { position: absolute; left: 0; top: 0; width: 520px; height: 246px; z-index: 8; opacity: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transform-origin: 260px 246px; }
      #tag .logo { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.55); margin-bottom: 8px; }
      #tag .logo img { width: 56px; height: 72px; object-fit: contain; }
      #tag .name { font-family: "MontserratHF", sans-serif; font-weight: 800; font-size: 38px; line-height: 1; color: #fff; white-space: nowrap;
        background: rgba(12, 12, 16, 0.86); border-radius: 16px; padding: 9px 18px 10px; margin-bottom: 6px; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5); }
      #tag svg { width: 64px; height: 86px; display: block; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.55)); }
      #banner { position: absolute; left: 50%; top: 118px; z-index: 9; opacity: 0; display: flex; align-items: stretch; height: 74px;
        transform: translateX(-50%); font-family: "PoppinsHF", sans-serif; font-weight: 800; color: #fff; border-radius: 12px; overflow: hidden;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55); }
      #banner .team { background: rgba(10, 10, 14, 0.9); font-size: 36px; padding: 0 22px; display: flex; align-items: center; letter-spacing: 1px; }
      #banner .score { background: var(--red); font-size: 42px; padding: 0 20px; display: flex; align-items: center; gap: 12px; perspective: 300px; }
      #banner .digit { display: inline-block; width: 30px; text-align: center; }
      #banner .min { background: #fff; color: #111; font-size: 30px; padding: 0 16px; display: flex; align-items: center; }
      #sub { position: absolute; left: 0; top: 1600px; width: 1080px; text-align: center; z-index: 10; font-family: "PoppinsHF", sans-serif;
        font-weight: 500; font-size: 46px; line-height: 1.15; color: #fff; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%DUR%%" data-width="1080" data-height="1920">
      <div id="cam">
%%IMGS%%
      </div>
      <div id="spot"></div>
      <div id="ring"></div>
      <div id="tag">
        <div class="logo"><img src="assets/img/realmadrid.png" alt="" /></div>
        <div class="name" id="tagname">Jude Bellingham</div>
        <svg viewBox="0 0 64 86" aria-hidden="true"><path d="M20 3 H44 V44 H60 L32 83 L4 44 H20 Z" fill="#ff1f1f" stroke="#3a0000" stroke-width="4" stroke-linejoin="round"/></svg>
      </div>
      <div id="banner">
        <div class="team">VAL</div>
        <div class="score"><span class="digit">0</span><span>–</span><span class="digit" id="d2">1</span></div>
        <div class="team">RMA</div>
        <div class="min">36'</div>
      </div>
      <div id="sub"></div>
%%AUDIO%%
    </div>
    <script>
      (function () {
        const D = %%DATA%%;
        const cam = document.getElementById("cam");
        const spot = document.getElementById("spot");
        const ring = document.getElementById("ring");
        const tag = document.getElementById("tag");
        const tagname = document.getElementById("tagname");
        const banner = document.getElementById("banner");
        const d2 = document.getElementById("d2");
        const sub = document.getElementById("sub");
        const TAG_W = 520, TAG_H = 246;
        function backOut(u) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
        function renderAt(t) {
          const k = Math.max(0, Math.min(D.n - 1, Math.floor(t * D.fps + 0.001)));
          const F = D.fr[k];
          cam.style.transform = "scale(" + F[2] + ") translate(" + (-F[0]) + "px," + (-F[1]) + "px)";
          const S = F[3];
          if (S) {
            const x = S[0], y = S[1], r = S[2], a = S[3];
            const m = "radial-gradient(circle " + r + "px at " + x + "px " + y + "px, transparent " + (r - 1) + "px, #000 " + (r + 1.5) + "px)";
            spot.style.webkitMaskImage = m; spot.style.maskImage = m; spot.style.opacity = a;
            ring.style.width = 2 * r + "px"; ring.style.height = 2 * r + "px";
            ring.style.transform = "translate(" + (x - r) + "px," + (y - r) + "px)"; ring.style.opacity = a;
          } else { spot.style.opacity = 0; ring.style.opacity = 0; }
          const G = F[4];
          if (G) {
            if (tagname.textContent !== G[0]) tagname.textContent = G[0];
            const bounce = 5 * Math.abs(Math.sin(2 * Math.PI * 1.4 * t));
            const gap = -3 + bounce;  // red tip sits ~4 px above the svg box bottom (stroke + shadow)
            const pop = Math.min(1, G[3] / 0.12);
            const s = pop >= 1 ? 1 : Math.max(0.01, backOut(pop));
            tag.style.transform = "translate(" + (G[1] - TAG_W / 2) + "px," + (G[2] - TAG_H - gap) + "px) scale(" + s + ")";
            tag.style.opacity = 1;
          } else { tag.style.opacity = 0; }
          // banner
          const bt = t - D.banner.t;
          if (bt >= 0) {
            const u = Math.min(1, bt / 0.12);
            banner.style.opacity = 1;
            banner.style.transform = "translateX(-50%) scale(" + (u >= 1 ? 1 : Math.max(0.01, backOut(u))) + ")";
          } else { banner.style.opacity = 0; }
          const ft = t - D.banner.flip;
          if (ft < 0) { d2.textContent = "1"; d2.style.transform = "rotateX(0deg)"; }
          else if (ft < 0.15) { d2.textContent = "1"; d2.style.transform = "rotateX(" + (ft / 0.15) * 90 + "deg)"; }
          else if (ft < 0.3) { d2.textContent = "2"; d2.style.transform = "rotateX(" + (-90 + ((ft - 0.15) / 0.15) * 90) + "deg)"; }
          else { d2.textContent = "2"; d2.style.transform = "rotateX(0deg)"; }
          // subtitles: one word at a time
          let w = "";
          for (let i = 0; i < D.subs.length; i++) { const s2 = D.subs[i]; if (t >= s2.s && t < s2.e) { w = s2.w; break; } }
          if (sub.textContent !== w) sub.textContent = w;
        }
        window.addEventListener("hf-seek", function (e) { renderAt(e.detail.time); });
        const tl = gsap.timeline({ paused: true, onUpdate: function () { renderAt(tl.time()); } });
        tl.to({ v: 0 }, { v: 1, duration: D.dur, ease: "none" }, 0);
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
