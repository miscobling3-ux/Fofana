<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:"Poppins";font-weight:800;src:url("assets/poppins-latin-800-normal.woff2") format("woff2");}
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Poppins",sans-serif}
.col{position:absolute;top:0;height:1920px;width:540px;overflow:hidden}
.col img{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#c1{left:0} #c2{left:540px}
#c1 img{transform:translate(-1394.0px,-85.3px) scale(2.1333)}
#c2 img{transform:translate(-3410.0px,-320.0px) scale(4.5714)}
#sep{position:absolute;left:536px;top:0;width:8px;height:1920px;background:#ff1f1f}
#grad{position:absolute;left:0;right:0;bottom:0;height:1056px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.92) 60%,#000)}
#words{position:absolute;left:0;width:1080px;bottom:115px;text-align:center;color:#fff;font-weight:800;font-size:150px;line-height:.98;letter-spacing:-2px;text-shadow:0 6px 18px rgba(0,0,0,.6)}
#band{position:absolute;left:50%;transform:translateX(-50%);bottom:455px;background:#ff1f1f;color:#fff;font-weight:800;font-size:54px;padding:12px 30px;border-radius:12px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.5)}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<div class="col clip" id="c1" data-start="0" data-duration="1"><img src="assets/geste.jpg" alt=""></div>
<div class="col clip" id="c2" data-start="0" data-duration="1"><img src="assets/visage.jpg" alt=""></div>
<div id="sep" class="clip" data-start="0" data-duration="1"></div>
<div id="grad" class="clip" data-start="0" data-duration="1"></div>
<div id="band" class="clip" data-start="0" data-duration="1">VALENCIA 0-3 REAL MADRID</div>
<div id="words" class="clip" data-start="0" data-duration="1">¡QUÉ<br>GOLAZO!</div>
</div>
<script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.set({},{},1);window.__timelines["main"]=tl;</script>
</body></html>
